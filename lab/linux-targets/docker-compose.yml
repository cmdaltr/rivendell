# Gandalf test targets and the collector that runs against them.
# Compose project 'rivendell-lab' (set by lab.sh), so Rivendell's own tooling
# (including Anduril) never treats these as Rivendell containers.
#
# Targets are reached by hostname on the private lab network, so this works the
# same on Docker Desktop and OrbStack, Intel and Apple silicon. Each target's SSH
# is also published on 127.0.0.1 only, for manual poking.

x-target: &target
  build:
    context: .
  environment:
    - LAB_PASSWORD # passed through from lab.sh (macOS Keychain), never stored
  networks: [lab]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 256M

services:
  ubuntu:
    <<: *target
    build: { context: ., args: { BASE: "ubuntu:24.04" } }
    image: rivendell-lab-target:ubuntu
    hostname: lab-ubuntu
    container_name: lab-ubuntu
    ports: ["127.0.0.1:2221:22"]

  rocky:
    <<: *target
    build: { context: ., args: { BASE: "rockylinux:9" } }
    image: rivendell-lab-target:rocky
    hostname: lab-rocky
    container_name: lab-rocky
    ports: ["127.0.0.1:2222:22"]

  # Clean Ubuntu hosts for stacking: with lab-ubuntu, three of one OS with the plants on one, so
  # stacking's rarity and precision@k can be measured. Only with `./lab.sh linux-targets stacking`.
  ubuntu-clean-1:
    <<: *target
    build: { context: ., args: { BASE: "ubuntu:24.04", SEED: "0" } }
    image: rivendell-lab-target:ubuntu-clean
    hostname: lab-ubuntu-clean1
    container_name: lab-ubuntu-clean1
    ports: ["127.0.0.1:2223:22"]
    profiles: [stacking]

  ubuntu-clean-2:
    <<: *target
    build: { context: ., args: { BASE: "ubuntu:24.04", SEED: "0" } }
    image: rivendell-lab-target:ubuntu-clean
    hostname: lab-ubuntu-clean2
    container_name: lab-ubuntu-clean2
    ports: ["127.0.0.1:2224:22"]
    profiles: [stacking]

  # Runs gandalf.py and gandalf.sh against the targets. Started on demand by
  # `./lab.sh gandalf-collect`, never left running.
  controller:
    profiles: [controller]
    build:
      context: ../controller
    image: rivendell-lab-controller
    container_name: lab-controller
    environment:
      - LAB_PASSWORD
      - GANDALF_ENCRYPTION
    volumes:
      - ${REPO_ROOT}/src/acquisition:/gandalf-src:ro
      - ${ACQ_ROOT}:/acquisitions
      - ../controller:/lab:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # VM targets via the Mac's loopback forwards
    networks: [lab]

networks:
  lab:
    name: rivendell-lab
